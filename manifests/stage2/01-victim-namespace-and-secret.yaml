# This represents a completely separate, unrelated application's namespace
# and secret — e.g. imagine this is the "payments-team" namespace. Our
# vulnerable app has NOTHING to do with this team, and in a properly
# configured cluster should have zero ability to read anything here.
apiVersion: v1
kind: Namespace
metadata:
  name: victim-app
  labels:
    purpose: security-lab-demo
---
apiVersion: v1
kind: Secret
metadata:
  name: payments-db-credentials
  namespace: victim-app
type: Opaque
stringData:
  username: payments_admin
  password: SuperSecretProdPassword123!
