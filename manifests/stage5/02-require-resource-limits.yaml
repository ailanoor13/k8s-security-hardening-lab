# Blocks any pod that doesn't declare CPU/memory limits. Our vulnerable-webapp
# had none — on a 2GB node, an unbounded pod could starve every other
# workload (including Falco and Kyverno themselves).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/description: >-
      Containers must set CPU and memory limits. Prevents a single
      misconfigured pod from starving node resources.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Containers must set resources.limits.memory and resources.limits.cpu"
        pattern:
          spec:
            containers:
              - name: "*"
                resources:
                  limits:
                    memory: "?*"
                    cpu: "?*"
