# Blocks the exact RBAC misconfiguration from Stage 2: a ClusterRole
# granting get/list/watch on secrets cluster-wide. This is what let our
# vulnerable-webapp read another team's secret in Stage 3. Namespace-scoped
# Roles (not ClusterRoles) are unaffected — this policy only stops the
# cluster-wide version of the mistake.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-clusterwide-secret-access
  annotations:
    policies.kyverno.io/title: Disallow Cluster-Wide Secret Access
    policies.kyverno.io/description: >-
      ClusterRoles must not grant get/list/watch on secrets across the whole
      cluster. This directly targets the RBAC misconfiguration exploited in
      Stage 3.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: block-broad-secret-clusterrole
      match:
        any:
          - resources:
              kinds:
                - ClusterRole
      validate:
        message: "ClusterRoles may not grant get/list/watch on secrets cluster-wide. Use a namespace-scoped Role instead."
        deny:
          conditions:
            all:
              - key: "secrets"
                operator: AnyIn
                value: "{{ request.object.rules[].resources[] }}"
              - key: "get"
                operator: AnyIn
                value: "{{ request.object.rules[].verbs[] }}"
